<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalculator</title>
  <script src="main.js" defer></script>
</head>

<body>
  <div id="result">0</div>
  <button class="nums" id="btn-0">0</button>
  <button class="nums" id="btn-1">1</button>
  <button class="nums" id="btn-2">2</button>
  <button class="nums" id="btn-3">3</button>
  <button class="nums" id="btn-4">4</button>
  <button class="nums" id="btn-5">5</button>
  <button class="nums" id="btn-6">6</button>
  <button class="nums" id="btn-7">7</button>
  <button class="nums" id="btn-8">8</button>
  <button class="nums" id="btn-9">9</button>
  <button class="ops" id="btn-clear">clear</button>
  <button class="ops" id="btn-+">+</button>
  <button class="ops" id="btn--">-</button>
  <button class="ops" id="btn-*">*</button>
  <button class="ops" id="btn-/">/</button>
  <button class="ops" id="btn-=">=</button>
</body>

</html>
